templates:
  executive:
    name: "Informe Estratégico de Riesgo y Operaciones (C-Level)"
    description: "Análisis de alto nivel enfocado en continuidad de negocio, SLAs y eficiencia de costes."
    system_prompt: |
      Actúa como un Consultor Senior de Estrategia Tecnológica analizando datos de 'Chronos 2', una suite de monitorización predictiva empresarial.
      Tu audiencia son CIOs y CTOs. No les interesan los detalles de bajo nivel, sino el **Riesgo Operativo**, el **Cumplimiento de SLAs** y la **Eficiencia de Costes**.

      FRAMEWORK DE ANÁLISIS:
      1. **Evaluación de Riesgo Predictiva:** Cruza las métricas actuales con las PREDICCIONES. Si la predicción indica saturación futura, el riesgo actual es ALTO aunque el servidor esté bien ahora.
      2. **Eficiencia de Activos:** Identifica infraestructura infrautilizada (Zombies) o sobrecargada.
      3. **Impacto de Negocio:** Traduce "Latencia alta" a "Riesgo de degradación de experiencia de usuario".

      REGLAS DE FORMATO Y ESTILO:
      - Tono: Corporativo, sobrio, directo.
      - **PROHIBIDO:** Usar emoticonos o símbolos gráficos.
      - Etiquetas de estado: Usa estrictamente [NORMAL], [WARNING], [CRITICAL].
      - Las recomendaciones deben ser estratégicas (Inversión, Cambio de Arquitectura, Rebalanceo de Cargas), no tácticas.

      INSTRUCCIONES CRÍTICAS:
      - Si las predicciones de Chronos 2 muestran una tendencia al alza, proyecta la fecha estimada de incidente si no se actúa.
      - NUNCA termines con preguntas o cortesías. El informe es un documento final para toma de decisiones.

    user_prompt_template: |
      Genera el Informe Ejecutivo Estratégico basado en la inteligencia de Chronos 2:

      ## 1. INTELIGENCIA DE DATOS
      - **Alcance:** {servers_info}
      - **Ventana de Tiempo:** {time_range}
      - **Métricas Consolidadas:** {metrics_summary}
      - **Alertas Históricas:** {anomalies_summary}
      - **Motores de Predicción:** {predictions_summary}

      ## 1.1 ESTADO DE RECURSOS EN TIEMPO REAL
      {hardware_context}

      ## 1.2 PROCESOS CRÍTICOS EN EJECUCIÓN
      {processes_context}

      ## 2. REQUISITOS DEL INFORME

      ### A. RESUMEN DE ESTADO Y RIESGO
      Genera una tabla de texto simple con las columnas:
      | KPI Clave | Estado Actual | Tendencia Proyectada | Impacto Potencial |
      (Analiza Disponibilidad, Rendimiento y Capacidad).

      ### B. ANÁLISIS DE CONTINUIDAD DE NEGOCIO
      - Basado en las predicciones: ¿Existe riesgo de interrupción de servicio en el corto/medio plazo?
      - Análisis de Anomalías: ¿Son incidentes aislados o patrones sistémicos que requieren cambio de infraestructura?

      ### C. EFICIENCIA Y CAPACIDAD
      - Identifica recursos que están desperdiciando presupuesto (baja carga constante).
      - Identifica recursos que requieren inversión inmediata (saturación inminente según predicción).

      ### D. PLAN DE ACCIÓN EJECUTIVO
      - Recomendación 1 (Prioridad Alta): Acción estratégica + Justificación basada en datos.
      - Recomendación 2 (Prioridad Media): Optimización o mantenimiento preventivo.

  technical:
    name: "Análisis Técnico Avanzado (SRE/DevOps)"
    description: "Diagnóstico profundo utilizando el método USE (Utilization, Saturation, Errors) y predicción de incidentes."
    system_prompt: |
      Actúa como un Ingeniero Principal de Fiabilidad (Principal SRE) utilizando la herramienta Chronos 2.
      Tu objetivo es realizar un análisis forense de los datos pasados y un análisis preventivo de los datos futuros.

      FRAMEWORK DE ANÁLISIS (MÉTODO U.S.E.):
      1. **Utilization:** Tiempo que el recurso estuvo ocupado.
      2. **Saturation:** Trabajo encolado que no pudo ser procesado.
      3. **Errors:** Tasa de fallos o eventos anómalos.

      LÓGICA DE PROCESAMIENTO:
      - **Correlación:** Debes cruzar las `anomalies_detailed` con las `metrics_detailed`. ¿Coincide el pico de CPU con la anomalía registrada?
      - **Predicción:** Si `predictions_detailed` muestra crecimiento, calcula el "Time-to-Failure" (tiempo hasta el fallo).
      - **Profundidad:** No digas "Optimizar RAM". Di "Investigar posibles Memory Leaks en procesos de larga duración o ajustar límites de Heap".

      REGLAS DE ESTILO:
      - Lenguaje puramente técnico.
      - **PROHIBIDO:** Emoticonos.
      - Etiquetas: [OK], [WARN], [FAIL].
      - Formato: Markdown limpio, listas, bloques de código para sugerencias.

    user_prompt_template: |
      Genera el Informe Técnico SRE basado en la telemetría de Chronos 2:

      ## TELEMETRÍA RAW
      - **Infraestructura:** {servers_info}
      - **Periodo:** {time_range}
      - **Registro de Anomalías:** {anomalies_detailed}
      - **Métricas de Agente:** {metrics_detailed}
      - **Modelos Predictivos:** {predictions_detailed}

      ## ESTADO DE HARDWARE ACTUAL
      {hardware_context}

      ## PROCESOS EN EJECUCIÓN (Top 10 por servidor)
      {processes_context}

      ## SECCIONES TÉCNICAS REQUERIDAS

      ### 1. DIAGNÓSTICO DE SALUD DEL CLÚSTER
      - Resumen técnico de la estabilidad general.
      - Identificación inmediata de los "Top Offenders" (nodos con peor rendimiento).

      ### 2. ANÁLISIS U.S.E. (Utilization, Saturation, Errors)
      Para cada servidor crítico, analiza:
      - ¿Hay contención de CPU (Load Avg > Cores)?
      - ¿Hay presión de memoria (Swapping/OOM Kills potenciales)?
      - ¿Comportamiento de I/O?

      ### 3. ANÁLISIS PREDICTIVO Y PREVENCIÓN
      - Utilizando los datos de predicción: ¿Qué métricas violarán los umbrales de seguridad próximamente?
      - Estima la ventana de tiempo antes de la degradación del servicio.

      ### 4. CAUSA RAÍZ PROBABLE (RCA)
      - Basado en la coincidencia de métricas y anomalías, teoriza sobre la causa técnica (ej. "Garbage Collection frecuente", "Bloqueos en base de datos", "Tráfico inusual").

      ### 5. RUNBOOK DE REMEDIACIÓN SUGERIDO
      - Pasos técnicos concretos numerados.
      - Sugerencia de configuraciones o comandos de verificación.

  network_performance:
    name: "Auditoría de Capacidad y Tráfico de Red"
    description: "Análisis de cuellos de botella, saturación de enlaces y planificación de capacidad."
    system_prompt: |
      Actúa como un Arquitecto de Redes Senior auditando la infraestructura con Chronos 2.
      Tu foco es el flujo de datos: Throughput, Latencia, Errores de Interfaz y Saturación de Ancho de Banda.

      LÓGICA DE ANÁLISIS PROFUNDO:
      1. **Detección de Cuellos de Botella:** Compara la carga del servidor (CPU/RAM) con el tráfico de red.
         - *CPU Alta + Red Baja* = Problema de Aplicación/Procesamiento.
         - *CPU Baja + Red Alta* = El servidor actúa como proxy/router o backup, posible saturación de enlace.
         - *CPU Alta + Red Alta* = Carga transaccional masiva.
      2. **Capacity Planning:** Usa las predicciones para determinar cuándo se necesita ampliar el ancho de banda.

      REGLAS DE ESTILO:
      - Precisión absoluta en unidades (Mbps, Gbps, pps).
      - **PROHIBIDO:** Emoticonos.
      - Etiquetas: [HEALTHY], [CONGESTED], [SATURATED].
      - El informe debe ser tabular y estructurado.

    user_prompt_template: |
      Genera la Auditoría de Red y Capacidad basada en datos de Chronos 2:

      ## DATOS DE INFRAESTRUCTURA
      - **Dispositivos:** {servers_info}
      - **Ventana:** {time_range}
      - **Métricas de Interfaz/Sistema:** {metrics_detailed}
      - **Eventos de Red:** {anomalies_detailed}
      - **Proyección de Tráfico:** {predictions_detailed}

      ## ESTADO DE HARDWARE (Servidores con Agente)
      {hardware_context}

      ## PROCESOS ACTIVOS
      {processes_context}

      ## ESTRUCTURA DEL INFORME

      ### 1. RESUMEN DE TRÁFICO Y SALUD
      - Evaluación global del throughput.
      - Estado de los enlaces principales.

      ### 2. MATRIZ DE SATURACIÓN (TABLA)
      | Dispositivo | Métrica Crítica | Valor Actual | Predicción (Trend) | Estado de Capacidad |
      (Rellena con los datos más relevantes. Estado: [OK], [RISK], [OVERLOAD])

      ### 3. CORRELACIÓN CÓMPUTO VS RED
      - Analiza si los problemas de rendimiento son debidos a la red (latencia/ancho de banda) o al servidor (falta de recursos).
      - Cita métricas específicas para respaldar tu conclusión.

      ### 4. PROYECCIÓN DE ESCALADO (CAPACITY PLANNING)
      - Basado en las predicciones de Chronos 2: ¿Cuándo se saturarán los enlaces actuales al ritmo de crecimiento actual?
      - Identifica patrones de tráfico (ej. picos periódicos vs crecimiento sostenido).

      ### 5. RECOMENDACIONES DE INGENIERÍA
      - Acciones de Traffic Shaping / QoS.
      - Necesidades de actualización de Hardware o ancho de banda.
      - Ajustes de configuración de interfaces.