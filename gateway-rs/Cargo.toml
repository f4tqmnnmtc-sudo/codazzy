[package]
name = "codazzy-gateway"
version = "1.0.0"
edition = "2021"
authors = ["Codazzy Team"]
description = "API Gateway + Consumer for predictive monitoring system"
license = "MIT"

[lib]
name = "codazzy_gateway"
path = "src/lib.rs"

[[bin]]
name = "codazzy-gateway"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full", "tracing", "signal"] }

# HTTP Framework
axum = { version = "0.7", features = ["ws", "multipart", "macros"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "compression-gzip", "trace", "timeout", "limit"] }
hyper = { version = "1.1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.1"
rmpv = "1.0"
lz4_flex = "0.11"

# InfluxDB
influxdb2 = "0.5"
influxdb2-structmap = "0.2"

# PostgreSQL
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "chrono", "uuid", "json", "migrate"] }

# Redis
redis = { version = "0.24", features = ["tokio-comp", "connection-manager", "aio"] }

# NATS JetStream
async-nats = "0.33"

# SSH
ssh2 = "0.9"

# MQTT
rumqttc = "0.24"

# HTTP client
reqwest = { version = "0.11", features = ["json", "rustls-tls", "gzip"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
once_cell = "1.19"
dashmap = "5.5"
parking_lot = "0.12"
futures = "0.3"
futures-util = "0.3"
async-trait = "0.1"
bytes = "1.5"
base64 = "0.21"
md5 = "0.7"
hex = "0.4"

# Validation
validator = { version = "0.16", features = ["derive"] }

# Regex for parsing
regex = "1.10"

# Markdown/HTML for reports
pulldown-cmark = "0.9"

# YAML for templates
serde_yaml = "0.9"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"
criterion = "0.5"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[profile.dev]
opt-level = 0
debug = true

